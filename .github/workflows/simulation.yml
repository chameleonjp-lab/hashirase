name: Verify T04 simulation
on:
  pull_request:
    paths:
      - 'src/modes/simulation/**'
      - 'src/contracts/**'
      - 'scripts/**'
      - 'tools/install-ci-browser.sh'
      - 'tests/physics/**'
      - 'tests/unit/simulation-isolation.test.mjs'
      - 'tests/integration/simulation-track.spec.mjs'
      - 'tests/fixtures/simulation-track.html'
      - 'package*.json'
      - '.github/workflows/simulation.yml'
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Analytic force model and independent sessions
        run: node --test tests/physics/straight-line.test.mjs tests/unit/simulation-isolation.test.mjs
      - name: Install Chromium and full dependencies from Ubuntu HTTPS archive
        run: bash tools/install-ci-browser.sh
      - name: Actual minimum track, HUD and canvas disposal
        run: npx playwright test tests/integration/simulation-track.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-${{ github.sha }}
          path: |
            test-results/
            dist/
          retention-days: 14
