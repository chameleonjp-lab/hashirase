name: Verify source layout
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm ci
      - name: Validate generated code, JavaScript syntax, and HTML references
        run: npm run check
      - name: Build isolated ESM foundation and audit split output
        run: npm run build
      - name: Install Chromium and full dependencies from Ubuntu HTTPS archive
        run: bash tools/install-ci-browser.sh
      - name: Exercise original regressions and isolated mode lifecycles
        run: npx playwright test
      - name: Stage only built runtime files for GitHub Pages
        run: npm run build && node scripts/stage-pages.mjs
      - name: Save browser diagnostics, screenshots, and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-browser-${{ github.sha }}
          path: test-results/
          retention-days: 14
      - name: Save ESM build and input graph
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-build-${{ github.sha }}
          path: dist/
          retention-days: 14
      - name: Upload tested Pages artifact on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Save independent expected deployment hashes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pages-expected-manifest
          path: .pages-site/build-info.json
          include-hidden-files: true
          retention-days: 14
  release-target:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: source-check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      publish: ${{ steps.target.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: target
        name: Exclude stale reruns before entering the deployment queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-target.mjs
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.release-target.outputs.publish == 'true'
    needs: [source-check, release-target]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Refuse to publish an older main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_sha" = "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - name: Publish the artifact after all regressions passed
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pages-expected-manifest
          path: ${{ runner.temp }}/pages-expected
      - name: Verify deployed commit, every runtime hash, repository paths and 404
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-deployment.mjs --url "$PAGES_URL" --expected-sha "$GITHUB_SHA" --manifest "$RUNNER_TEMP/pages-expected/build-info.json"
