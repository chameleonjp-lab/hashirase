name: Verify source layout
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generated code, JavaScript syntax, and HTML references
        run: npm run check
